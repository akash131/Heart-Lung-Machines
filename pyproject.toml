[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-lung-machines"
version = "2.0.0"
description = "Comprehensive cardiopulmonary bypass system with vendor-parity features including bypass circuit management, bubble detection, temperature control, cardioplegia delivery, blood gas monitoring, goal-directed perfusion, HL7 integration, and full audit/compliance support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
hl7 = [
    "hl7>=0.4.0",
]
serial = [
    "pyserial>=3.5",
]
full = [
    "numpy>=1.24.0",
    "hl7>=0.4.0",
    "pyserial>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]
